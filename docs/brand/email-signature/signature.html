<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <title>BookOn email signature</title>
  </head>
  <body style="margin: 24px; font-family: Arial, Helvetica, sans-serif">
    <!--
      BookOn email signature. Open this file in Chrome or Safari, press Cmd+A then
      Cmd+C (that copies the logo and text together), and paste into your email
      app's signature settings. Change the name, role and mobile after pasting.
      The logo loads from https://bookon.au/brand/bookon-icon-email.png.
    -->
    <table
      cellpadding="0"
      cellspacing="0"
      border="0"
      role="presentation"
      style="border-collapse: collapse; font-family: Arial, Helvetica, sans-serif; color: #14211a"
    >
      <tr>
        <td style="padding: 0 14px 0 0; vertical-align: top">
          <a href="https://bookon.au" style="text-decoration: none">
            <img
              src="https://bookon.au/brand/bookon-icon-email.png"
              width="56"
              height="56"
              alt="BookOn"
              style="display: block; border: 0; width: 56px; height: 56px; border-radius: 12px"
            />
          </a>
        </td>
        <td style="padding: 0 0 0 14px; vertical-align: top; border-left: 2px solid #1f6f43">
          <p style="margin: 0; font-size: 15px; font-weight: bold; line-height: 20px">Your Name</p>
          <p style="margin: 0 0 6px; font-size: 13px; line-height: 18px; color: #5b6b62">
            Founder, <span style="color: #1f6f43; font-weight: bold">BookOn</span>
          </p>
          <p style="margin: 0; font-size: 13px; line-height: 19px">
            <a href="tel:+61400000000" style="color: #14211a; text-decoration: none"
              >0400 000 000</a
            >
            &nbsp;·&nbsp;
            <a href="mailto:info@bookon.au" style="color: #14211a; text-decoration: none"
              >info@bookon.au</a
            >
          </p>
          <p style="margin: 0; font-size: 13px; line-height: 19px">
            <a
              href="https://bookon.au"
              style="color: #1f6f43; font-weight: bold; text-decoration: none"
              >bookon.au</a
            >
            &nbsp;·&nbsp;<span style="color: #5b6b62">Less searching, more golfing.</span>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
