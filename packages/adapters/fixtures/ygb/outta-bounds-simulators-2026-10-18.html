B designades för multiaktivitetsanläggningar, inte bara medlemsklubbar.","nl":"Specialistische golfsporten? Geen probleem. YGB is ontworpen voor entertainmentlocaties met uitgebreide functies, niet alleen voor ledenclubs.","sk":"Špecializované športy založené na golfe? Žiadny problém. YGB bol navrhnutý pre zábavné podniky s bohatými funkciami, nielen pre členské kluby."},"uid":"specialist golf-based sports? no problem. ygb was designed for feature rich entertainment venues, no"},{"id":20,"value":"With all the new golf-based sports that are available, you need a good way to manage them. Your customers aren't going to be used to complicated tee systems, so let's make it easy for them.","data":{"de":"Bei all den neuen Golfsportarten, die auf dem Markt sind, brauchen Sie eine gute Möglichkeit, sie zu verwalten. Ihre Kunden werden nicht an komplizierte Buchingssysteme gewöhnt sein, also machen wir es ihnen leicht.","fr":"Avec tous les sports liés au golf traditionnel, vous avez besoin d'une manière efficace pour les gérer. L'objectif est de permettre a vos clients d'utiliser facilement et rapidement le système.","es":"Con todos los nuevos deportes basados en el golf que están disponibles, necesita una buena forma de administrarlos. Sus clientes no estarán acostumbrados a complicados sistemas de tees, así que hagámoslo fácil para ellos.","jp":"ゴルフをベースとした新しいスポーツが登場した今、適切な管理方法が必要です。お客様は複雑なティーシステムには慣れていないでしょうから、簡単にできるようにしましょう。","ko":"골프 기반의 모든 새로운 스포츠를 이용하려면 이를 관리할 수 있는 좋은 방법이 필요합니다. 고객은 복잡한 시스템에 익숙하지 않을것이므로 쉽게 만들 수 있도록 하겠습니다.","no":"Med alle de nye golfbaserte idrettsaktivitetene som er tilgjengelige, trenger du en god måte å administrere dem på. Kundene dine kommer ikke til å bli vant til kompliserte booking-systemer, så la oss gjøre det enkelt for dem.","da":"Med alle de nye golfbaserede sportsgrene, der er tilgængelige, har du brug for en god måde at håndtere dem på. Dine kunder vil ikke være vant til komplicerede tee-systemer, så lad os gøre det nemt for dem.","pl":"Z w útu"},"uid":"expires in \u003c 1 minute"},{"id":199,"value":"Selected bay","data":{"de":"Ausgewählte Abschlagsbox","fr":"Baie sélectionnée","es":"Bahía seleccionada","jp":"","ko":"","no":"Valgt bukt","da":"Valgt simulator","pl":"Wybrano stanowisko","it":"Baia selezionata","cs":"Vybrané odpaliště","sv":"Vald zon","nl":"Geselecteerde bay","sk":"Vybrané odpalisko"},"uid":"selected bay"},{"id":200,"value":"Click below for something else","data":{"de":"Klicken Sie unten, um zu sehen, was sonst noch verfügbar ist","fr":"Cliquez ci-dessous et explorez ce qui est aussi disponible","es":"Haga clic a continuación para ver qué más hay disponible","jp":"クリックすると、他の商品もご覧いただけます。","ko":"아래를 클릭하면 다른 상품을 확인할 수 있습니다.","no":"Klikk under for å se hva annet som er tilgjengelig","da":"Klik nedenfor for noget andet","pl":"Kliknij poniżej, żeby zobaczyć coś innego","it":"Clicca qui sotto per qualcos'altro","cs":"Klikněte níže pro něco jiného","sv":"Klicka nedan för något annat","nl":"Klik hieronder voor iets anders","sk":"Kliknite nižšie pre niečo iné"},"uid":"click below for something else"},{"id":201,"value":"event","data":{"de":"Veranstaltung","fr":"événement","es":"evento","jp":"","ko":"","no":"arrangement","da":"Begivenhed","pl":"wydarzenie","it":"evento","cs":"eventy","sv":"händelse","nl":"Evenement","sk":"udalosť"},"uid":"bookingmeta_event"},{"id":202,"value":"quantity","data":{"de":"Menge","fr":"quantité","es":"cantidad","jp":"","ko":"","no":"antall","da":"Antal","pl":"ilość","it":"quantità","cs":"Množství","sv":"mängd","nl":"Aantal","sk":"množstvo"},"uid":"bookingmeta_quantity"},{"id":203,"value":"Managing tees shouldn't be hard or complicated.","data":{"de":"Die Verwaltung von Abschlägen sollte nicht schwierig oder kompliziert sein.","fr":"Gérer des départs ne devrait pas être compliqué","es":"Gestionar tee times no debería de ser dificil o complicado.","jp":"ティーの管理は難しくも複雑でもありません","ko":"티 오프 관리는 어렵거나 복잡해서는 안 됩니다.","no":"Å administrere spilletider bør ikke være vanskelig eller komplisert.","da":"Det skal ikke være svært eller kompliceret at administrere spilletider.","pl":"Zarządzanie tee time'ami nie powinno być trudne ani skomplikowane.","it":"Gestire i tee time non dovrebbe essere difficile o complicato.","cs":"Správa odpališť by neměla být složitá ani komplikovaná.","sv":"Att hantera starttider ska inte vara svårt eller komplicerat.","nl":"Het beheren van tees zou niet moeilijk of ingewikkeld moeten zijn.","sk":"Správa tee timov by nemala byť náročná ani komplikovaná."},"uid":"managing tees shouldn\\'t be hard or complicated."},{"id":204,"value":"Managing tees shouldn't be hard or complicated. Let members and guests book, pay and play without the hassle.","data":{"de":"Die Verwaltung von Abschlägen sollte nicht schwierig oder kompliziert sein. Lassen Sie Mitglieder und Gäste buchen, bezahlen und spielen, ohne dass Sie sich darum kümmern müssen.","fr":"Gérer des départs ne devrait pas être compliqué. Laissez les membres et les autres golfeurs reserver, payer et jouer sans les tracas.","es":"Gestionar tee times no debería de ser dificil o complicado. Permite a tus socios e invitados reservar, jugar y pagar sin agobios.","jp":"ティーの管理は難しくも複雑でもありません。メンバーやゲストに煩わしさを感じさせずに、予約、支払、プレーを可能にしましょう。","ko":"티 오프 관리는 어렵거나 복잡해서는 안 됩니다. 회원과 게스트가 번거로움 없이 예약, 결제, 플레이를 할 수 있도록 하세요.","no":"Å administrere spilletider bør ikke være vanskelig eller komplisert. La medlemmer og gjester bestille, betale og spille uten problemer.","da":"Det skal ikke være svært eller kompliceret at administrere spilletider. Lad medlemmer og gæster booke, betale og spille uden besvær.","pl":"Zarządzanie tee time'ami nie powinno być trudne ani skomplikowane. Pozwól członkom i gościom łatwo rezerwować, płacić i grać bez zbędnych komplikacji.","it":"Gestire i tee time non dovrebbe essere difficile o complicato. Lascia che soci e ospiti prenotino, paghino e giochino senza problemi.","cs":"Správa odpališť by neměla být složitá ani komplikovaná. Nechte členy a hosty rezervovat, platit a hrát bez starostí.","sv":"Att hantera starttider ska inte vara svårt eller komplicerat. Låt medlemmar och gäster boka, betala och spela utan krångel.","nl":"Het beheren van tees zou niet moeilijk of ingewikkeld moeten zijn. Laat leden en gasten reserveren, betalen en spelen zonder gedoe.","sk":"Správa tee timov by nemala byť náročná ani komplikovaná. Umožnite členom a hosťom rezervovať, zaplatiť a hrať bez problémov."},"uid":"managing tees shouldn\\'t be hard or complicated. let members and guests book, pay and play without t"},{"id":205,"value":"Managing your tee sheets shouldn't be hard or complicated. With us you get a clean and lean interface that you and your customers can pick up in minutes.","data":{"de":"Die Verwaltung Ihrer Abschlagslisten sollte nicht schwer oder kompliziert sein. Mit uns erhalten Sie eine saubere und schlanke Benutzeroberfläche, die Sie und Ihre Kunden in wenigen Minuten nutzen können.","fr":"Gérer des départs ne devrait pas être compliqué. Avec nous, vous aurez une interface que vos clients et vous pourrez vous approprier en quelques minutes","es":"Gestionar tee times no debería de ser dificil o complicado. Con nosotros tendrás una interfaz limpia y clara que tu y yus clientes entenderéis rápido.","jp":"ティーシートの管理は難しくも複雑でもありません。無駄のないすっきりとしたインターフェースで、あなたもお客様もすぐに使いこなせます。","ko":"티 오프 내역을 관리하는 것이 어렵거나 복잡해서는 안 됩니다. 저희와 함께라면 여러분과 고객이 몇 분 안에 사용할 수 있는 깔끔하고 간결한 인터페이스를 가질 수 있습니다.","no":"Å administrere spilletider bør ikke være vanskelig eller komplisert. Med oss får du et rent og ryddig grensesnitt som du og dine kunder vil forstå på få minutter.","da":"At administrere dine tee-sheets skal ikke være svært eller kompliceret. Hos os får du en enkel og overskuelig brugerflade, som du og dine kunder kan forstå på få minutter.","pl":"Zarządzanie tee sheetami nie powinno być trudne ani skomplikowane. Z nami otrzymujesz czysty, prosty interfejs, który Ty i Twoi klienci opanujecie w kilka minut.","it":"Gestire i tuoi tee sheet non dovrebbe essere difficile o complicato. Con noi ottieni un'interfaccia semplice ed essenziale che tu e i tuoi clienti potete imparare in pochi minuti.","cs":"Správa vašich časových rozpisů odpališť by neměla být složitá ani komplikovaná. S námi získáte čisté a přehledné rozhraní, které si vy i vaši zákazníci osvojíte během pár minut.","sv":"Att hantera starttidsscheman ska inte vara svårt eller krångligt. Med vårt smidiga och intuitiva system kommer både du och dina kunder igång på bara några minuter.","nl":"Het beheren van je tee-sheets zou niet moeilijk of ingewikkeld moeten zijn. Bij ons krijg je een schone en eenvoudige interface die jij en je klanten binnen enkele minuten onder de knie hebben.","sk":"Správa vašich tee timov by nemala byť ťažká ani komplikovaná. S nami získate čisté a jednoduché rozhranie, ktoré si vy a vaši zákazníci môžete osvojiť v priebehu niekoľkých minút."},"uid":"managing your tee sheets shouldn\\'t be hard or complicated. with us you get a clean and lean interfa"},{"id":206,"value":"A tee-sheet designed specially for mini-golf that's easy to use for non-golfers. Take group bookings and upsell customers.","data":{"de":"Ein speziell für Minigolf entworfener Startzeitenbogen, der auch für Nicht-Golfer leicht zu bedienen ist. Nehmen Sie Gruppenbuchungen entgegen und bieten Sie Kunden Upgrade Möglichkeiten an.","fr":"Une feuille de départ spécifique au minigolf, facile pour tous. Recevez les réservations de groupes et effectuez des ventes additionelles.","es":"Un hoja de salidas diseñada especialmente para mini-golf que es fácil de usar para los no golfistas. Tome reservas de grupo y aumente las ventas de los clientes.","jp":"ミニゴルフ専用のティーシートは、ゴルフをしない方にも使いやすく設計。グループの予約、お客様へのアップセルの機会です。","ko":"골프를 치지 않는 사람도 쉽게 사용할 수 있는 미니 골프 전용 티 오프 내역서 입니다. 단체 예약을 받고 고객을 상향 판매하세요.","no":"En spiller og booking oversikt designet spesielt for minigolf som er enkelt å bruke for ikke-golfere. Ta gruppebestillinger og generer mersalg til kunder.","da":"Et tee-sheet designet specielt til minigolf, der er nemt at bruge for ikke-golfere. Tag gruppebookinger og sælg mere til kunderne.","pl":"Tee sheet stworzony specjalnie dla mini-golfa, prosty w obsłudze nawet dla osób, które nie grają w golfa. Przyjmuj rezerwacje grupowe i zwiększaj sprzedaż dzięki dodatkowym usługom.","it":"Un tee-sheet progettato appositamente per il mini-golf, facile da usare anche per chi non gioca a golf. Accetta prenotazioni di gruppi e proponi upgrade ai clienti.","cs":"Rozpis odpališť navržený speciálně pro minigolf, který je snadno použitelný i pro ne-golfisty. Umožněte skupinové rezervace a zvyšte prodeje doplňkových služeb.","sv":"Ett starttidsschema designat särskilt för minigolf, enkelt att använda även för icke-golfare. Ta emot gruppbokningar och sälj mer till dina kunder.","nl":"Een tee-sheet speciaal ontworpen voor minigolf die eenvoudig te gebruiken is voor niet-golfers. Neem groepsreserveringen aan en verkoop extra's aan klanten.","sk":"Tee timy navrhnuté špeciálne pre minigolf, ktoré sa ľahko používa aj pre negolfistov. Prijímajte skupinové rezervácie a zvyšujte predaj zákazníkov."},"uid":"a tee-sheet designed specially for mini-golf that\\'s easy to use for non-golfers. take group booking"},{"id":207,"value":"Your mini-golf course is a huge asset that should be maximised. It's going to be frequented by non-golfers, so it needs to be easy to book.","data":{"de":"Ihre Minigolfanlage ist eine großer Gewinnmöglichkeit, der optimal genutzt werden sollte. Sie wird auch von Nicht-Golfern besucht werden, also muss sie leicht zu buchen sein.","fr":"Votre parcours de minigolf est un atout qui devrait être maximisé. Il sera aussi fréquenté par des non-golfeurs et doit être facile à utiliser.","es":"Su campo de minigolf es un gran activo que debe maximizarse. Va a ser frecuentado por no golfistas, por lo que debe ser fácil de reservar.","jp":"ミニゴルフコースは大きな魅力です。ゴルフをしない方も頻繁に訪れるので、簡単に予約できる必要があります。","ko":"당신의 미니 골프 코스는 최대한 활용해야 할 최대의 자산입니다. ","no":"Minigolfbanen din er en enorm ressurs som bør utnyttes maksimalt. Den kommer til å bli besøkt av ikke-golfere, så det må være enkelt å bestille spill.","da":"Din minigolfbane er en stor ressource, der bør maksimeres. Den vil blive besøgt af ikke-golfere, så den skal være nem at booke.","pl":"Twój tor do mini-golfa to ogromny atut, który warto maksymalnie wykorzystać. Będzie odwiedzany głównie przez osoby niegrające w golfa, więc rezerwacja musi być prosta i intuicyjna.","it":"Il tuo campo da mini-golf è una risorsa importante che dovrebbe essere valorizzata al massimo. Sarà frequentato da persone che non giocano a golf, quindi deve essere facile da prenotare.","cs":"Vaše minigolfové hřiště je obrovským aktivem, které by mělo být maximálně využito. Budou ho navštěvovat i ne-golfisté, proto musí být snadné na rezervaci.","sv":"Din minigolfbana är en stor tillgång som bör utnyttjas maximalt. Den kommer att besökas av många som inte spelar golf, så det måste vara enkelt att boka.","nl":"Je minigolfbaan is een waardevol bezit dat optimaal benut moet worden. Het zal vooral bezocht worden door niet-golfers, dus het moet eenvoudig te reserveren zijn.","sk":"Vaše minigolfové ihrisko je obrovským prínosom, ktorý by ste mali maximalizovať. Budú ho navštevovať negolfisti, takže rezervácia musí byť jednoduchá."},"uid":"your mini-golf course is a huge asset that should be maximised. it\\'s going to be frequented by non-"},{"id":208,"value":"Point of Sale is the glue that holds your in-venue operations together. If you like what we're doing with bookings, you'll love what's possible when everything is integrated.","data":{"de":"Der Verkaufsort ist der Klebstoff, der Ihre Abläufe am Veranstaltungsort zusammenhält. Wenn Ihnen gefällt, was wir mit dem Buchungssystem machen, werden Sie begeistert sein, was möglich ist, wenn alles integriert ist.","fr":"Point de Vente est la base de toute vos opérations internes. Si vous aimez ce que nous faisons avec les réservations, vous aimerez d'autant plus les multiples possibilités lorsque tout est integré.","es":"El punto de venta es el pegamento que mantiene unidas sus operaciones en el lugar. Si te gusta lo que estamos haciendo con las reservas, te encantará lo que es posible cuando todo está integrado.","jp":"POSはあなたの施設内業務をまとめる接着剤です。予約管理の方法を気に入っていただけたなら、他のすべてが統合されたときも気に入っていただけることでしょう。","ko":"POS는 현장 오퍼레이션을 하나로 묶어주는 집합체입니다. 저희의 예약 방식이 마음에 든다면 모든것이 통합되어 가능한 일이 마음에 드실 겁니다.","no":"Point of Sale er limet som holder virksomheten din sammen. Hvis du liker det vi gjør med bookinger, vil du elske det som er mulig når alt er integrert.","da":"Point of Sale er limen, der holder dine operationer på stedet sammen. Hvis du kan lide det, vi gør med booking, vil du elske, hvad der er muligt, når alting er integreret.","pl":"System Point of Sale to spoiwo, które łączy wszystkie operacje w Twoim obiekcie. Jeśli podoba Ci się to, co robimy z rezerwacjami, pokochasz możliwości, jakie daje pełna integracja.","it":"Il punto vendita è il collante che unisce tutte le tue operazioni interne. Se ti piace ciò che facciamo con le prenotazioni, amerai ciò che è possibile quando tutto è integrato.","cs":"Pokladní systém je pojivo, které drží provoz vašeho areálu pohromadě. Pokud se vám líbí, co děláme s rezervacemi, budete nadšení z toho, co je možné, když je vše propojeno.","sv":"Point of Sale är det som håller ihop dina verksamhetsprocesser på plats. Om du gillar hur vi hanterar bokningar, kommer du att älska möjligheterna med en helt integrerad lösning.","nl":"Het kassasysteem is de lijm die jouw operationele processen in de locatie bij elkaar houdt. Als je enthousiast bent over wat we doen met boekingen, zul je versteld staan van wat er mogelijk is wanneer alles geïntegreerd is.","sk":"Miesto predaja je lepidlo, ktoré drží vaše operácie na mieste pohromade. Ak sa vám páči, čo robíme s rezerváciami, budete milovať, čo je možné, keď je všetko integrované."},"uid":"point of sale is the glue that holds your in-venue operations together. if you like what we\\'re doin"},{" golf entworfener Startzeitenbogen, der auch für Nicht-Golfer leicht zu bedienen ist. Nehmen Sie Gruppenbuchungen entgegen und bieten Sie Kunden Upgrade Möglichkeiten an.","fr":"Une feuille de départ spécifique au minigolf, facile pour tous. Recevez les réservations de groupes et effectuez des ventes additionelles.","es":"Un hoja de salidas diseñada especialmente para mini-golf que es fácil de usar para los no golfistas. Tome reservas de grupo y aumente las ventas de los clientes.","jp":"ミニゴルフ専用のティーシートは、ゴルフをしない方にも使いやすく設計。グループの予約、お客様へのアップセルの機会です。","ko":"골프를 치지 않는 사람도 쉽게 사용할 수 있는 미니 골프 전용 티 오프 내역서 입니다. 단체 예약을 받고 고객을 상향 판매하세요.","no":"En spiller og booking oversikt designet spesielt for minigolf som er enkelt å bruke for ikke-golfere. Ta gruppebestillinger og generer mersalg til kunder.","da":"Et tee-ark designet specielt til minigolf, der er nemt at bruge for ikke-golfspillere. Tag gruppebookinger og opsælg kunder.","pl":"Tabela tee times zaprojektowana specjalnie dla mini-golfa, łatwy w użyciu dla osób niegrających w golfa. Przyjmuj rezerwacje grupowe i zwiększaj sprzedaż klientom.","it":"Un tee sheet progettato appositamente per il minigolf e facile da usare per i non golfisti. Accetta prenotazioni di gruppo e fai upselling ai clienti.","cs":"Tee-timy navržené speciálně pro minigolf, které je snadno použitelné i pro negolfisty. Přijměte skupinové rezervace a upsellujte zákazníkům.","sv":"Ett bokningsschema speciellt utformat för minigolf som är enkelt att använda för icke-golfare. Ta emot gruppbokningar och erbjud merförsäljning.","nl":"Een tee-sheet speciaal ontworpen voor midgetgolf die eenvoudig te gebruiken is voor niet-golfers. Neem groepsreserveringen aan en verkoop extra's aan klanten.","sk":"Tee sheets navrhnuté špeciálne pre minigolf, ktoré sa ľahko používa aj pre negolfistov. Prijímajte skupinové rezervácie a zvyšujte predaj zákazníkov."},"uid":"a tee-sheet designed specially for mini-golf that's easy to use for non-golfers. take group booking"},{"id":226,"value":"Your mini-golf course is a huge asset that should be maximised. It's going to be frequented by non-golfers, so it needs to be easy to book.","data":{"de":"Ihre Minigolfanlage ist eine großer Gewinnmöglichkeit, der optimal genutzt werden sollte. Sie wird auch von Nicht-Golfern besucht werden, also muss sie leicht zu buchen sein.","fr":"Votre parcours de minigolf est un atout qui devrait être maximisé. Il sera aussi fréquenté par des non-golfeurs et doit être facile à utiliser.","es":"Su campo de minigolf es un gran activo que debe maximizarse. Va a ser frecuentado por no golfistas, por lo que debe ser fácil de reservar.","jp":"ミニゴルフコースは大きな魅力です。ゴルフをしない方も頻繁に訪れるので、簡単に予約できる必要があります。","ko":"당신의 미니 골프 코스는 최대한 활용해야 할 최대의 자산입니다.","no":"Minigolfbanen din er en enorm ressurs som bør utnyttes maksimalt. Den kommer til å bli besøkt av ikke-golfere, så det må være enkelt å bestille spill.","da":"Din minigolfbane er et kæmpe aktiv, som bør maksimeres. Det vil blive besøgt af ikke-golfspillere, så det skal være nemt at reservere og booke.","pl":"Twoje pole golfowe to ogromny atut, który powinien być maksymalnie wykorzystany. Będą odwiedzać je osoby niegrające w golfa, dlatego musi być łatwe do zarezerwowania.","it":"Il tuo campo da minigolf è una risorsa enorme che dovrebbe essere massimizzata. Sarà frequentato da non golfisti, quindi deve essere facile da prenotare.","cs":"Vaše minigolfové hřiště je obrovským přínosem, který by měl být maximalizován. Bude to navštěvovat negolfisté, takže musí být snadné ji rezervovat.","sv":"Din minigolfbana är en enorm tillgång som bör maximeras. Den kommer att besökas av icke-golfare, så det måste vara lätt att boka.","nl":"Je minigolfbaan is een waardevol bezit dat optimaal benut moet worden. Het zal vooral bezocht worden door niet-golfers, dus het moet eenvoudig te reserveren zijn.","sk":"Vaše minigolfové ihrisko je obrovským prínosom, ktorý by ste mali maximalizovať. Budú ho navštevovať negolfisti, takže rezervácia musí byť jednoduchá."},"uid":"your mini-golf course is a huge asset that should be maximised. it's going to be frequented by non-"},{"id":227,"value":"Point of Sale is the glue that holds your in-venue operations together. If you like what we're doing with bookings, you'll love what's possible when everything is integrated.","data":{"de":"Der Verkaufsort ist das Bindeglied, das Ihre Abläufe am Veranstaltungsort zusammenhält. Wenn Ihnen gefällt, was wir mit dem Buchungssystem machen, werden Sie begeistert sein, was möglich ist, wenn alles integriert ist.","fr":"Point de Vente est la base de toute vos opérations internes. Si vous aimez ce que nous faisons avec les réservations, vous aimerez d'autant plus les multiples possibilités lorsque tout est integré.","es":"El punto de venta es el pegamento que mantiene unidas sus operaciones en el lugar. Si te gusta lo que estamos haciendo con las reservas, te encantará lo que es posible cuando todo está integrado.","jp":"POSはあなたの施設内業務をまとめる接着剤です。予約管理の方法を気に入っていただけたなら、他のすべてが統合されたときも気に入っていただけることでしょう。","ko":"POS는 현장 오퍼레이션을 하나로 묶어주는 집합체입니다. 저희의 예약 방식이 마음에 든다면 모든것이 통합되어 가능한 일이 마음에 드실 겁니다.","no":"Point of Sale er limet som holder virksomheten din sammen. Hvis du liker det vi gjør med bookinger, vil du elske det som er mulig når alt er integrert.","da":"Point of Sale er limen, der holder dine in-venue operationer sammen. Hvis du kan lide det, vi laver med bookinger, vil du elske, hvad der er muligt, når alt er integreret.","pl":"Punkt sprzedaży łączy działania w jednym miejscu. Jeśli podoba Ci się to, co robimy z rezerwacjami, pokochasz także możliwości integracji wszystkich systemów.","it":"Il punto vendita è il collante che tiene insieme le tue operazioni in sede. Se ti piace ciò che facciamo con le prenotazioni, adorerai ciò che è possibile fare quando tutto è integrato.","cs":"Point of Sale je lepidlo, které drží vaše operace na místě pohromadě. Pokud se vám líbí, co děláme s rezervacemi, budete milovat, co je možné, když je vše integrováno.","sv":"Kassasystemet är limmet som håller dina verksamheter samman. Om du gillar det vi gör med bokningar, kommer du att älska vad som är möjligt när allt är integrerat.","nl":"Het kassasysteem is de lijm die jouw operationele processen in de locatie bij elkaar houdt. Als je enthousiast bent over wat we doen met boekingen, zul je versteld staan van wat er mogelijk is wanneer alles geïntegreerd is.","sk":"Miesto predaja je lepidlo, ktoré drží vaše operácie na mieste pohromade. Ak sa vám páči, čo robíme s rezerváciami, budete milovať, čo je možné, keď je všetko integrované."},"uid":"point of sale is the glue that holds your in-venue operations together. if you like what we're doin"},{"id":228,"value":"Enter your current email address and we'll send you an email that will allow you to reset your password.","data":{"de":"Geben Sie Ihre aktuelle E-Mail-Adresse ein und wir senden Ihnen eine E-Mail, mit der Sie Ihr Passwort zurücksetzen können.","fr":"Saisissez l'email rattaché à votre compte, vous recevrez aussitôt à cette adresse email où vous pourrez réinitialisez votre mot de passe","es":"Ingrese su dirección de correo electrónico actual y le enviaremos un correo electrónico que le permitirá restablecer su contraseña.","jp":"現在のメールアドレスを入力してください。パスワードをリセットするためのメールを送信します。","ko":"이메일 주소를 입력하시면 비밀번호를 재설정할 수 있는 이메일을 보내드립니다.","no":"Skriv inn din nåværende e-postadresse, så sender vi deg en e-post som lar deg tilbakestille passordet ditt.","da":"Indtast din nuværende e-mailadresse, og vi sender dig en e-mail, som giver dig mulighed for at nulstille din adgangskode.","pl":"Wpisz swój aktualny adres e-mail, a my wyślemy Ci wiadomość e-mail, która umożliwi Ci zresetowanie hasła.","it":"Inserisci il tuo indirizzo email attuale e ti invieremo un'email che ti consentirà di reimpostare la password.","cs":"Zadejte svou aktuální e-mailovou adresu a my vám zašleme e-mail, který vám umožní obnovit heslo.","sv":"Ange din nuvarande e-postadress så skickar vi dig ett e-postmeddelande för att återstä efundValue}} {{refundUnit}}{{#plural}}s{{/plural}}** im Voraus stornieren.","fr":"**{{venue}}** autorise les remboursements sur votre **solde YGB** à condition d'annuler **{{refundValue}} {{refundUnit}}{{#plural}}s{{/plural}}** à l'avance.","es":"**{{venue}}** permite reembolsos a tu **saldo YGB** siempre que canceles **{{refundValue}} {{refundUnit}}{{#plural}}s{{/plural}}** con anticipación.","jp":"","ko":"","no":"**{{venue}}** tillater refusjoner til din **YGB‑saldo** så lenge du avbestiller **{{refundValue}} {{refundUnit}}{{#plural}}s{{/plural}}** på forhånd.","da":"**{{venue}}** tillader refundering til din **YGB-saldo**, så længe du annullerer **{{refundValue}} {{refundUnit}}{{#plural}}er{{/plural}}** i forvejen.","pl":"**{{venue}}** umożliwia zwroty na Twoje **saldo YGB**, jeśli anulujesz rezerwację co najmniej **{{refundValue}} {{refundUnit}}{{#plural}}s{{/plural}}** wcześniej.","it":"**{{venue}}** consente rimborsi al tuo **saldo YGB** purché tu cancelli con **{{refundValue}} {{refundUnit}}{{#plural}}s{{/plural}}** di anticipo.","cs":"**{{venue}}** umožňuje vrácení částky na váš **YGB účet** pokud zrušíte rezervaci alespoň **{{refundValue}} {{refundUnit}}{{#plural}}y{{/plural}}** předem.","sv":"{{venue}} tillåter återbetalning till ditt YGB-saldo så länge du avbokar {{refundValue}} {{refundUnit}}{{#plural}}s{{/plural}} i förväg.","nl":"**{{venue}}** biedt terugbetalingen naar je **YGB-saldo** zolang je **{{refundValue}} {{refundUnit}}{{#plural}}s{{/plural}}** van tevoren annuleert.","sk":"**{{venue}}** umožňuje vrátenie peňazí na váš **zostatok YGB**, pokiaľ **{{refundValue}} {{refundUnit}}{{#plural}}s{{/plural}}** vopred zrušíte"},"uid":"**{{venue}}** allows refunds to your **ygb balance** as long as you cancel **{{refundvalue}} {{refun"},{"id":346,"value":"If you cancel this booking, we'll refund the valud of this booking and its extras back to your **YGB balance** so you can book again. This is **NOT** a refund to your bank account.","data":{"de":"Wenn Sie diese Buchung stornieren, erstatten wir den Wert dieser Buchung und ihrer Extras zurück auf Ihr **YGB-Guthaben**, damit Sie erneut buchen können. Dies ist **KEINE** Rückerstattung auf Ihr Bankkonto.","fr":"Si vous annulez cette réservation, nous rembourserons la valeur de cette réservation et de ses extras sur votre **solde YGB** afin que vous puissiez réserver à nouveau. Il ne s'agit **PAS** d'un remboursement sur votre compte bancaire.","es":"Si cancelas esta reserva, reembolsaremos el valor de esta reserva y sus extras a tu **saldo YGB** para que puedas reservar de nuevo. Esto **NO** es un reembolso a tu cuenta bancaria.","jp":"","ko":"","no":"Hvis du avbestiller denne bestillingen, vil vi refundere verdien av denne bestillingen og tilleggene til din **YGB‑saldo** slik at du kan bestille igjen. Dette er **IKKE** en tilbakebetaling til bankkontoen din.","da":"Hvis du annullerer denne booking, refunderer vi værdien af denne booking og dens ekstraydelser til din **YGB-saldo**, så du kan booke igen. Dette er **IKKE** en tilbagebetaling til din bankkonto.","pl":"Jeśli anulujesz tę rezerwację, zwrócimy wartość tej rezerwacji oraz dodatków na **saldo YGB**, aby można było dokonać nowej rezerwacji. To **NIE** jest zwrot na konto bankowe.","it":"Se cancelli questa prenotazione, rimborseremo il valore della prenotazione e degli extra al tuo **saldo YGB**, così potrai prenotare di nuovo. Questo **NON** è un rimborso sul tuo conto bancario.","cs":"Pokud tuto rezervaci zrušíte, vrátíme hodnotu této rezervace a doplňkových položek na váš **YGB účet**, abyste mohli znovu rezervovat. Toto **NENÍ** vrácení peněz na váš bankovní účet.","sv":"Om du avbokar denna bokning, kommer vi att återbetala värdet av bokningen och dess tillval till ditt YGB-saldo så att du kan boka igen. Detta är INTE en återbetalning till ditt bankkonto.","nl":"Als je deze reservering annuleert, storten we de waarde van deze reservering en de extra's terug op je **YGB-saldo** zodat je opnieuw kunt boeken. Dit is **NIET** een terugbetaling naar je bankrekening.","sk":"Ak túto rezerváciu zrušíte, vrátime vám hodnotu tejto rezervácie a jej doplnkov späť do vášho **zostatku YGB**, aby ste si mohli rezervovať znova. Toto **NIE JE** vrátenie peňazí na váš bankový účet"},"uid":"if you cancel this booking, we'll refund the valud of this booking and its extras back to your **ygb"},{"id":347,"value":"**{{venue}}** only allows refunds to your **YGB balance** if you cancel **{{refundValue}} {{refundUnit}}{{#plural}}s{{/plural}}** in advance.","data":{"de":"**{{venue}}** erlaubt Rückerstattungen auf Ihr **YGB-Guthaben** nur, wenn Sie **{{refundValue}} {{refundUnit}}{{#plural}}s{{/plural}}** im Voraus stornieren.","fr":"**{{venue}}** n'autorise les remboursements sur votre **solde YGB** que si vous annulez **{{refundValue}} {{refundUnit}}{{#plural}}s{{/plural}}** à l'avance.","es":"**{{venue}}** solo permite reembolsos a tu **saldo YGB** si cancelas **{{refundValue}} {{refundUnit}}{{#plural}}s{{/plural}}** con anticipación.","jp":"","ko":"","no":"**{{venue}}** tillater kun refusjoner til din **YGB‑saldo** hvis du avbestiller **{{refundValue}} {{refundUnit}}{{#plural}}s{{/plural}}** på forhånd.","da":"**{{venue}}** tillader kun refundering til din **YGB-saldo**, hvis du annullerer **{{refundValue}} {{refundUnit}}{{#plural}}er{{/plural}}** i forvejen.","pl":"**{{venue}}** umożliwia zwroty na **saldo YGB** tylko wtedy, gdy rezerwacja zostanie anulowana co najmniej **{{refundValue}} {{refundUnit}}{{#plural}}s{{/plural}}** wcześniej.","it":"**{{venue}}** consente rimborsi al tuo **saldo YGB** solo se cancelli con **{{refundValue}} {{refundUnit}}{{#plural}}s{{/plural}}** di anticipo.","cs":"**{{venue}}** umožňuje vrácení částky na váš **YGB účet** pouze pokud zrušíte alespoň **{{refundValue}} {{refundUnit}}{{#plural}}y{{/plural}}** předem.","sv":"{{venue}} tillåter endast återbetalning till ditt YGB-saldo om du avbokar {{refundValue}} {{refundUnit}}{{#plural}}s{{/plural}} i förväg.","nl"  retiro!\\n\\nSi tienes pagos pendientes, se volverán a intentar pronto. Si algo sale mal, te lo haremos saber.\\n\\nEl calendario de tus pagos puede depender del establecimiento que los organiza, así que ponte en contacto con ellos directamente.","jp":"","ko":"","no":"Supert, takk for at du la til en utbetalingskonto!\\n\\nHvis du har ventende utbetalinger, vil disse bli forsøkt igjen snart. Hvis noe går galt, gir vi deg beskjed.\\n\\nTidsplanen for utbetalingene dine kan avhenge av anlegget som organiserer dem, så ta kontakt med dem direkte.","da":"Fint, tak for at tilføje en udbetalingskonto!\\n\\nHvis du har udbetalinger, der afventer, vil de snart blive forsøgt igen. Hvis noget går galt, giver vi dig besked.\\n\\nPlanen for dine udbetalinger kan afhænge af den facilitet, der organiserer dem, så kontakt dem direkte.","pl":"Świetnie, dziękujemy za dodanie konta wypłat!\\n\\nJeśli masz jakieś oczekujące wypłaty, wkrótce zostaną ponownie przetworzone.\\n\\nJeśli pojawi się jakiś problem, damy Ci znać.","it":"Ottimo, grazie per aver aggiunto un conto per i pagamenti!\\n\\nSe hai dei pagamenti in sospeso, verranno riprovati a breve. Se qualcosa va storto te lo faremo sapere.\\n\\nLa pianificazione dei tuoi pagamenti potrebbe dipendere dalla struttura che li gestisce, quindi contattali direttamente.","cs":"Skvělé, děkujeme za přidání účtu pro výplaty!\\n\\nPokud máte nějaké nevyřízené výplaty, brzy se o ně znovu pokusíme. Pokud se něco pokazí, dáme vám vědět.\\n\\nHarmonogram vašich výplat může záviset na zařízení, které je zpracovává, proto je prosím kontaktujte přímo.","sv":"Tack för att du har lagt till ett utbetalningskonto!\\n\\nOm du har några väntande utbetalningar kommer dessa att försöka behandlas igen snart, och om något går fel meddelar vi dig.\\n\\nSchemat för dina utbetalningar kan bero på anläggningen som organiserar dem, så kontakta dem direkt.","nl":"Geweldig, bedankt voor het toevoegen van een uitbetalingsaccount!\\n\\nAls je openstaande uitbetalingen ueName}}."},"uid":"please make sure you have checked all of the details on the checkout page, and thoroughly read throu"},{"id":434,"value":"If you confirm this booking, you are committing to the time you have chosen and to paying on arrival. {{venueName}} may allow rescheduling this reservation.","data":{"de":"Wenn Sie diese Buchung bestätigen, verpflichten Sie sich zu der von Ihnen gewählten Zeit und zur Zahlung bei Ankunft. {{venueName}} könnte die Umbuchung dieser Reservierung erlauben.","fr":"Si vous confirmez cette réservation, vous vous engagez à respecter l'heure que vous avez choisie et à payer à votre arrivée. {{venueName}} peut autoriser la reprogrammation de cette réservation.","es":"Si confirmas esta reserva, te comprometes a la hora que has elegido y a pagar a la llegada. {{venueName}} puede permitir reprogramar esta reserva.","jp":"","ko":"","no":"Hvis du bekrefter denne bestillingen, forplikter du deg til det valgte tidspunktet og til å betale ved ankomst. {{venueName}} kan tillate ombooking av denne reservasjonen.","da":"Hvis du bekræfter denne booking, binder du dig til den valgte tid og til at betale ved ankomst. {{venueName}} kan tillade omplanlægning af reservationen.","pl":"Potwierdzając tę rezerwację, zobowiązujesz się do wybranej godziny oraz do płatności na miejscu. {{venueName}} może umożliwić zmianę terminu tej rezerwacji.","it":"Confermando questa prenotazione, ti impegni all'orario scelto e al pagamento all'arrivo. {{venueName}} potrebbe consentire di riprogrammare questa prenotazione.","cs":"Potvrzením této rezervace se zavazujete k vybranému času a k platbě při příchodu. {{venueName}} může umožnit přeplánování této rezervace.","sv":"Om du bekräftar denna bokning förbinder du dig till den tid du har valt och att betala vid ankomst. {{venueName}} kan tillåta ombokning av denna reservation.","nl":"Als je deze reservering bevestigt, verplicht je je tot de gekozen tijd en de betaling bij aankomst. {{venueName}} kan het mogelijk maken om de unds. If you're waiting on a payout and would like an update, please reach out to the venue that initiated the payout.","data":{"de":"Unten sind die Auszahlungen aufgeführt, die Sie über die Plattform erhalten haben, und ihr aktueller Status. Wenn der Status einer Auszahlung **„Link verfügbar“** lautet, klicken Sie auf die Schaltfläche **„Auszahlung erhalten“**, um Ihr Konto einzurichten und Ihr Geld zu erhalten. Wenn Sie auf eine Auszahlung warten und ein Update wünschen, wenden Sie sich bitte an den Veranstaltungsort, der die Auszahlung initiiert hat.","fr":"Vous trouverez ci-dessous les paiements que vous avez reçus sur la plateforme et leur statut actuel. Si le statut d'un paiement est **« lien disponible »**, cliquez sur le bouton **« recevoir le paiement »** pour configurer votre compte et recevoir vos fonds. Si vous attendez un paiement et souhaitez obtenir une mise à jour, veuillez contacter le lieu qui a initié le paiement.","es":"A continuación se muestran los pagos que has recibido en la plataforma y su estado actual. Si el estado de un pago es **\"enlace disponible\"**, haz clic en el botón **\"recibir pago\"** para configurar tu cuenta y recibir tus fondos. Si estás esperando un pago y deseas una actualización, ponte en contacto con el establecimiento que inició el pago.","jp":"","ko":"","no":"Nedenfor finner du utbetalingene du har mottatt på plattformen og deres nåværende status. Hvis statusen er **\"lenke tilgjengelig\"**, klikk **\"motta utbetaling\"** for å sette opp kontoen din og motta pengene dine. Hvis du venter på en utbetaling og ønsker en oppdatering, ta kontakt med stedet som initierte utbetalingen.","da":"Nedenfor er de udbetalinger, du har modtaget på platformen, og deres aktuelle status. Hvis en udbetaling har status **\"link tilgængelig\"**, skal du klikke på knappen **\"modtag udbetaling\"** for at opsætte din konto og modtage dine penge. Hvis du venter på en udbetaling og ønsker en opdatering, bedes du kontakte stedet, der har initieret udbetalingen.","pl":"Poniżej znajdują się wypłaty, które otrzymałeś na platformie, oraz ich aktualny status. Jeśli status wypłaty to **„link dostępny”**, kliknij przycisk **„odbierz wypłatę”**, aby skonfigurować swoje konto i otrzymać środki. Jeśli czekasz na wypłatę i chcesz uzyskać aktualizację, skontaktuj się z obiektem, który ją zainicjował.","it":"Di seguito sono riportati i pagamenti ricevuti sulla piattaforma e il loro stato attuale. Se lo stato di un pagamento è **\"link disponibile\"**, clicca sul pulsante **\"ricevi pagamento\"** per configurare il tuo account e ricevere i fondi. Se sei in attesa di un pagamento e desideri un aggiornamento, contatta la sede che ha avviato il pagamento.","cs":"Níže jsou uvedeny výplaty, které jste na platformě obdrželi, a jejich aktuální stav. Pokud je stav výplaty **\"odkaz k dispozici“**, klikněte na tlačítko **\"přijmout výplatu“** a nastavte si účet a obdržíte své prostředky. Pokud čekáte na výplatu a chcete získat aktuální informace, kontaktujte prosím místo, které výplatu iniciovalo.","sv":"Nedan visas de utbetalningar du har fått på plattformen och deras nuvarande status. Om statusen för en utbetalning är **\"länk tillgänglig\"**, klicka på knappen **\"ta emot utbetalning\"** för att ställa in ditt konto och ta emot dina pengar. Om du väntar på en utbetalning och vill ha en uppdatering, vänligen kontakta anläggningen som initierade utbetalningen.","nl":"Hieronder staan de uitbetalingen die je op het platform hebt ontvangen en hun huidige status. Als de status **\"link beschikbaar\"** is, klik dan op de knop **\"uitbetaling ontvangen\"** om je account in te stellen en je geld te ontvangen. Als je op een uitbetaling wacht en een update wilt, neem dan contact op met de locatie die de uitbetaling heeft gestart.","sk":""},"uid":"below are the payouts you've received on the platform and their current status. if a payout status"},{"id":545,"value":"Get an overview of packages and package types offered at your facility.",
